<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marquee 1400x560</title>
<link rel="stylesheet" href="common.css">
<style>
  body { width: 1400px; height: 560px; }
  .tile {
    width: 1400px; height: 560px; position: relative; overflow: hidden;
    background:
      radial-gradient(700px 420px at 100% 0%, rgba(165, 106, 245, 0.45), transparent 70%),
      radial-gradient(600px 400px at 0% 100%, rgba(80, 36, 144, 0.65), transparent 70%),
      #12101c;
  }
  .copy { position: absolute; left: 90px; top: 50%; transform: translateY(-50%); width: 460px; }
  .logo { width: 104px; height: 104px; filter: drop-shadow(0 12px 30px rgba(129, 71, 213, 0.55)); }
  .name { margin-top: 26px; font-size: 56px; font-weight: 800; letter-spacing: -1.4px; line-height: 1.02; }
  .tag { margin-top: 14px; font-size: 21px; color: #cfc3e8; line-height: 1.45; }
  .formats { margin-top: 22px; font-size: 15px; font-weight: 600; color: #a99dc4; letter-spacing: 0.3px; }

  .player {
    position: absolute; right: 80px; top: 70px; width: 700px; height: 420px;
    border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  .menu-pos { right: 118px; bottom: 64px; width: 212px; }
</style>
</head>
<body>
<div class="tile">
  <div class="copy">
    <img class="logo" src="../../extension/icons/logo.svg" alt="">
    <div class="name">Stream to mpv</div>
    <div class="tag">One click on any web video player, pick a resolution, and watch it in mpv.</div>
    <div class="formats">HLS · MP4 · WEBM · YOUTUBE · EMBEDS</div>
  </div>

  <div class="player video">
    <img class="scene" src="scene.svg" alt="">
    <div class="controls">
      <div class="progress"><span></span></div>
      <div class="ctrl-row">
        <div class="ctrl-left">
          <div class="ctrl-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          <div class="ctrl-btn"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg></div>
          <span class="time">4:12 / 11:05</span>
        </div>
        <div class="ctrl-right">
          <div class="mpv-root">
            <button class="mpv-trigger hover">
              <svg class="mpv-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
              <span class="mpv-badge">mpv</span>
            </button>
          </div>
          <div class="ctrl-btn"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></div>
        </div>
      </div>
    </div>
    <div class="mpv-menu menu-pos" style="right: 52px;">
      <div class="mpv-menu-header">Open in mpv</div>
      <div class="mpv-item"><span>Auto (Best Quality)</span><span class="mpv-item-tag">BEST</span></div>
      <div class="mpv-item"><span>2160p</span><span class="mpv-item-tag">4K</span></div>
      <div class="mpv-item hover"><span>1080p</span><span class="mpv-item-tag">HD</span></div>
      <div class="mpv-item"><span>720p</span><span class="mpv-item-tag">HD</span></div>
      <div class="mpv-item"><span>Audio Only</span><span class="mpv-item-tag">MP3/AAC</span></div>
    </div>
  </div>
</div>
</body>
</html>
